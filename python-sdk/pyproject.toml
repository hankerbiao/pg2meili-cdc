[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melidata-sdk"
version = "0.1.0"
description = "Python SDK for MeliData document and distributed search services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25,<1",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/melidata_sdk"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
