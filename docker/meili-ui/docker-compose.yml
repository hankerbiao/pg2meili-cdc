# 官方 mini-dashboard（Meilisearch 外部 UI）静态托管
# 只做静态文件服务，API 请求由浏览器直连 MEILI_SERVER_ADDRESS（CORS 已由 meilisearch 放开）
#
# 部署目录约定（服务器）：/opt/meili-ui
#   dist/            <- 本地构建产物
#   nginx.conf       <- 本文件
#   docker-compose.yml
name: meili-ui

services:
  ui:
    image: nginx:1.27-alpine
    container_name: meili-ui
    restart: unless-stopped
    ports:
      - "${MEILI_UI_PORT:-7701}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
