<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniData 开放平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 20px; padding: 60px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #666; margin-bottom: 40px; font-size: 16px; }
        .links { display: flex; flex-direction: column; gap: 15px; }
        .link { display: block; padding: 15px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 10px; transition: all 0.3s; font-size: 16px; }
        .link:hover { background: #764ba2; transform: translateY(-2px); }
        .link.secondary { background: #f5f5f5; color: #333; }
        .link.secondary:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>UniData 开放平台</h1>
        <p class="subtitle">分布式搜索数据管理平台</p>
        <div class="links">
            <a href="/docs" class="link">API 文档</a>
            <a href="/api/v1/open-platform" class="link secondary">开放平台管理</a>
        </div>
    </div>
</body>
</html>
