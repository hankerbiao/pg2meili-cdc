<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 申请 | UniData</title>
    <link rel="stylesheet" href="/libs/layui/css/layui.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            display: flex;
            align-items: center;
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* 页面主体 */
        .page-header {
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 40px 0;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-desc {
            color: var(--text-muted);
            font-size: 15px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 32px;
            margin-bottom: 32px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 表单定制 */
        .layui-form-label {
            width: 100px;
            font-weight: 500;
            color: var(--text-main);
        }

        .layui-input-block {
            margin-left: 130px;
        }

        .layui-input {
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: 42px;
            transition: all 0.2s;
        }

        .layui-input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .layui-btn {
            height: 42px;
            line-height: 42px;
            border-radius: 8px;
            font-weight: 600;
            padding: 0 24px;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: var(--primary) !important;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 结果展示 */
        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .token-display {
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: monospace;
            word-break: break-all;
            margin: 10px 0;
            font-size: 13px;
            color: #1e293b;
        }

        /* 表格样式 */
        .layui-table {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .layui-table th {
            background: #f8fafc;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-revoked { background: #fee2e2; color: #991b1b; }

        @media (max-width: 640px) {
            .layui-form-label {
                float: none;
                width: 100%;
                text-align: left;
                padding: 0 0 8px 0;
            }
            .layui-input-block {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">
                <i data-lucide="database"></i>
                UniData
            </a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/app/register">Token 申请</a>
                <a href="/health">服务状态</a>
                <a href="/docs/brief" target="_blank">文档</a>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Token 申请与管理</h1>
            <p class="page-desc">申请访问令牌以开始使用 UniData 分布式搜索与同步服务。</p>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <i data-lucide="plus-circle" style="color: var(--primary);"></i>
                新应用申请
            </div>
            <form class="layui-form" action="">
                <div class="layui-form-item">
                    <label class="layui-form-label">应用名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_name" required lay-verify="required" placeholder="请输入应用系统名称" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">IT Code</label>
                    <div class="layui-input-block">
                        <input type="text" name="itcode" required lay-verify="required" placeholder="请输入您的 IT Code" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn btn-submit" lay-submit lay-filter="registerForm">提交申请</button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>

            <div id="resultBox" class="result-box">
                <div style="font-weight: 600; color: #166534; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="check-circle-2" style="width: 18px;"></i>
                    申请已提交，请等待管理员审核。
                </div>
                <div style="margin-top: 12px; font-size: 14px; color: #475569;">
                    审核通过后，您可以使用 IT Code 在下方查询您的 Token。
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <i data-lucide="search" style="color: var(--primary);"></i>
                Token 查询
            </div>
            <div class="layui-form">
                <div class="layui-form-item">
                    <label class="layui-form-label">IT Code</label>
                    <div class="layui-input-block" style="display: flex; gap: 10px;">
                        <input type="text" id="queryItcode" placeholder="输入 IT Code 查询已生成的 Token" class="layui-input">
                        <button class="layui-btn layui-btn-normal" onclick="queryTokens()">查询</button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <table class="layui-table" lay-skin="line">
                    <thead>
                        <tr>
                            <th>应用名称</th>
                            <th>状态</th>
                            <th>失效时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tokenTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">暂无数据，请输入 IT Code 进行查询</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/libs/layui/layui.js"></script>
    <script>
        lucide.createIcons();

        layui.use(['form', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;
            
            form.on('submit(registerForm)', function(data){
                fetch('/api/v1/auth/tokens/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data.field)
                })
                .then(resp => resp.json())
                .then(res => {
                    if (res.message === 'ok' || res.id) {
                        document.getElementById('resultBox').style.display = 'block';
                        layer.msg('提交成功', {icon: 1});
                    } else {
                        layer.msg('提交失败: ' + (res.message || '未知错误'), {icon: 2});
                    }
                })
                .catch(err => {
                    layer.msg('网络请求失败', {icon: 2});
                });
                return false;
            });
        });

        function queryTokens() {
            var itcode = document.getElementById('queryItcode').value;
            if (!itcode) {
                layer.msg('请输入 IT Code');
                return;
            }

            fetch('/api/v1/auth/tokens/my?itcode=' + itcode)
            .then(resp => resp.json())
            .then(res => {
                var data = res.data || res;
                var tbody = document.getElementById('tokenTableBody');
                tbody.innerHTML = '';
                
                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">未找到相关 Token 记录</td></tr>';
                    return;
                }

                data.forEach(item => {
                    var tr = document.createElement('tr');
                    var statusClass = item.is_revoked ? 'status-revoked' : (item.token ? 'status-active' : 'status-pending');
                    var statusText = item.is_revoked ? '已撤销' : (item.token ? '已激活' : '待审核');
                    
                    tr.innerHTML = `
                        <td>${item.app_name}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${item.expires_at ? item.expires_at.split('T')[0] : '-'}</td>
                        <td>
                            ${item.token ? `<button class="layui-btn layui-btn-xs layui-btn-primary" onclick="viewToken('${item.token}')">查看 Token</button>` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        function viewToken(token) {
            layui.layer.open({
                title: '您的访问令牌 (Token)',
                content: `<div class="token-display">${token}</div><p style="font-size: 12px; color: #ef4444; margin-top: 8px;">请妥善保管，切勿泄露给他人。</p>`,
                area: ['400px']
            });
        }
    </script>
</body>
</html>
