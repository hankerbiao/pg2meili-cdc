<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 审核 | UniData</title>
    <link rel="stylesheet" href="/libs/layui/css/layui.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            display: flex;
            align-items: center;
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* 页面主体 */
        .page-header {
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 40px 0;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-desc {
            color: var(--text-muted);
            font-size: 15px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 32px;
            margin-bottom: 32px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 表格定制 */
        .layui-table {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .layui-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-main);
            padding: 16px;
        }

        .layui-table td {
            padding: 16px;
            color: #475569;
        }

        .layui-btn-sm {
            border-radius: 6px;
            font-weight: 500;
        }

        .btn-approve {
            background-color: var(--primary) !important;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">
                <i data-lucide="database"></i>
                UniData
            </a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/app/register">Token 申请</a>
                <a href="/health">服务状态</a>
                <a href="/docs/brief" target="_blank">文档</a>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Token 审核中心</h1>
            <p class="page-desc">管理员可以在此审核新应用的 Token 申请请求。</p>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <i data-lucide="clipboard-check" style="color: var(--primary);"></i>
                待处理申请
            </div>
            
            <table class="layui-table" lay-skin="line">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>应用名称</th>
                        <th>申请人 (IT Code)</th>
                        <th>申请时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tokenTableBody">
                    <!-- 动态加载内容 -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/libs/layui/layui.js"></script>
    <script>
        lucide.createIcons();

        layui.use(['layer'], function () {
            var layer = layui.layer;

            function formatDate(s) {
                if (!s) return '';
                const date = new Date(s);
                return date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            function loadTokens() {
                fetch('/api/v1/auth/tokens/pending')
                    .then(resp => resp.json())
                    .then(res => {
                        // 兼容包装格式 {data: [...], message: "ok"} 或 直接数组
                        const data = res.data || res;
                        const tbody = document.getElementById('tokenTableBody');
                        tbody.innerHTML = '';
                        
                        if (!Array.isArray(data) || data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i data-lucide="inbox" style="margin: 0 auto 12px; width: 40px; height: 40px; opacity: 0.2;"></i><p>当前没有待审核的申请</p></td></tr>';
                            lucide.createIcons();
                            return;
                        }

                        data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${item.id}</td>
                                <td style="font-weight: 500; color: var(--text-main);">${item.app_name}</td>
                                <td><code>${item.itcode}</code></td>
                                <td>${formatDate(item.created_at)}</td>
                                <td>
                                    <button class="layui-btn layui-btn-sm btn-approve" onclick="approveToken(${item.id})">
                                        通过审核
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    })
                    .catch(err => {
                        layer.msg('加载失败', {icon: 2});
                    });
            }

            window.approveToken = function(id) {
                layer.confirm('确定通过该应用的 Token 申请吗？', {
                    title: '审核确认',
                    btn: ['确定', '取消']
                }, function(index) {
                    fetch(`/api/v1/auth/tokens/${id}/approve`, {
                        method: 'POST'
                    })
                    .then(resp => resp.json())
                    .then(res => {
                        if (res.message === 'ok' || res.status === 'approved') {
                            layer.msg('审核已通过', {icon: 1});
                            loadTokens();
                        } else {
                            layer.msg('操作失败: ' + (res.message || '未知错误'), {icon: 2});
                        }
                    })
                    .catch(err => {
                        layer.msg('网络请求失败', {icon: 2});
                    });
                    layer.close(index);
                });
            };

            loadTokens();
        });
    </script>
</body>
</html>
