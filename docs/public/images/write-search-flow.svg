<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <style>
      .box { fill: #f8f9fb; stroke: #2f3b4a; stroke-width: 2; rx: 10; ry: 10; }
      .text { font-family: "Arial", sans-serif; font-size: 16px; fill: #1f2a37; }
      .arrow { stroke: #1f2a37; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .caption { font-family: "Arial", sans-serif; font-size: 13px; fill: #6b7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2a37" />
    </marker>
  </defs>

  <rect class="box" x="30" y="40" width="140" height="60"/>
  <text class="text" x="100" y="75" text-anchor="middle">Client</text>
  <text class="caption" x="100" y="98" text-anchor="middle">Write</text>

  <rect class="box" x="210" y="40" width="160" height="60"/>
  <text class="text" x="290" y="75" text-anchor="middle">UniData API</text>

  <rect class="box" x="410" y="40" width="170" height="60"/>
  <text class="text" x="495" y="75" text-anchor="middle">PostgreSQL</text>

  <rect class="box" x="620" y="40" width="170" height="60"/>
  <text class="text" x="705" y="75" text-anchor="middle">Debezium (CDC)</text>

  <rect class="box" x="830" y="40" width="120" height="60"/>
  <text class="text" x="890" y="75" text-anchor="middle">Kafka</text>

  <rect class="box" x="980" y="40" width="190" height="60"/>
  <text class="text" x="1075" y="70" text-anchor="middle">Sync Service</text>
  <text class="caption" x="1075" y="92" text-anchor="middle">meilisearch-sync-service</text>

  <rect class="box" x="520" y="150" width="200" height="60"/>
  <text class="text" x="620" y="185" text-anchor="middle">Meilisearch Node</text>

  <rect class="box" x="30" y="150" width="160" height="60"/>
  <text class="text" x="110" y="185" text-anchor="middle">Search Client</text>
  <text class="caption" x="110" y="208" text-anchor="middle">Query</text>

  <line class="arrow" x1="170" y1="70" x2="210" y2="70"/>
  <line class="arrow" x1="370" y1="70" x2="410" y2="70"/>
  <line class="arrow" x1="580" y1="70" x2="620" y2="70"/>
  <line class="arrow" x1="790" y1="70" x2="830" y2="70"/>
  <line class="arrow" x1="950" y1="70" x2="980" y2="70"/>
  <line class="arrow" x1="1075" y1="100" x2="1075" y2="150"/>
  <line class="arrow" x1="520" y1="180" x2="190" y2="180"/>
</svg>
