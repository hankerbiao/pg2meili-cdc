# Production-only Compose overrides.
# Keep data-plane services private; nginx is the sole public entry point.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  zookeeper:
    ports: !override
      - "127.0.0.1:${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"

  connect:
    ports: !override
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"

  kafka-ui:
    ports: !override
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"

  meilisearch:
    ports: !override
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"

  redis:
    # UniData reaches Redis over the Compose network at redis:6379.
    # Do not publish it on the host: this avoids collisions with a system Redis.
    ports: !reset []

  unidata:
    ports: !override
      - "127.0.0.1:${UNIDATA_PORT:-8080}:8080"
